name: ML System CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка линтеров
        run: pip install ruff

      - name: Линтинг (ruff)
        run: ruff check .

  test-and-build:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Установка Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Установка зависимостей
        run: pip install -r requirements.txt

      - name: Автоматическое тестирование (pytest)
        run: pytest tests/ -v

      - name: Сборка Docker-образа
        run: docker build -t pump-predictor:${{ github.sha }} .

      - name: Запуск контейнера
        run: |
          docker run -d -p 8000:8000 --name test-api pump-predictor:${{ github.sha }}
          # ждём, пока сервис поднимется (до 30 сек)
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "service is up"
              break
            fi
            sleep 1
          done

      - name: Smoke-тест /health через curl
        run: |
          curl --fail --show-error http://localhost:8000/health

      - name: Smoke-тест /predict через curl
        run: |
          curl --fail --show-error -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"timestamp":"2026-11-27T10:00:00","temperature":75.0,"pressure":15.0,"vibration":3.0,"current":12.5}'

      - name: Логи контейнера (при падении)
        if: failure()
        run: docker logs test-api

      - name: Остановка контейнера
        if: always()
        run: docker stop test-api || true
